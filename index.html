<!DOCTYPE html>
<html lang="en">
<head>
    <title>Profile Card</title>
    <link rel="stylesheet" href="new.css">
</head>
<body>
    <main>
        
        <div class="imgContainer">
            <div class="img-Holder">
                <img src="Yasir.jpeg" alt="Profile Picture">
            </div>
        </div>

        <div class="info-Container">
            <h1>Lemoh Yasir Ayinde</h1>
            <p>lemohyasir@gmail.com</p>
            <p class="ideas">Aspiring Frontend Developer</p>
        </div>
           
            <div class="social-media">
                <img src="facebook.png" alt="Facebook">
                <img src="linkedin.png" alt="LinkedIn">
                <img src="Xtwitter.png" alt="Twitter">
                <img src="instagram.png" alt="Instagram">

            <div class="buttons">
                <button>Follow</button>
                <button style="border: 2px solid #25aba4; background-color: white; color: #25aba4;">Message</button>
            </div>
        </div>
    </main>
</body>
</html>
